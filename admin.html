<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Pastamania</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #fdfcf5; --header-bg: #f8f1e5; --primary-text: #3e2723; --accent-color: #e67e22; --shadow: 0 4px 6px rgba(0,0,0,0.05); }
        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 0; background-color: var(--bg-color); color: var(--primary-text); display: flex; flex-direction: column; min-height: 100vh; }
        
        .header { background-color: var(--header-bg); padding: 20px; text-align: center; box-shadow: var(--shadow); border-bottom: 2px solid #eae0d0; position: relative;}
        .header h1 { margin: 0; font-family: 'Playfair Display', serif; font-size: 2.5em; color: #8d6e63; }
        .header h2 { margin: 5px 0 0 0; font-weight: 400; font-size: 1.1em; opacity: 0.8; }
        #btn-logout { position: absolute; top: 20px; right: 20px; background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; display: none; }

        /* Login Container */
        #login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; padding: 20px; }
        .login-box { background: white; padding: 40px; border-radius: 15px; box-shadow: var(--shadow); border: 2px solid #eae0d0; width: 100%; max-width: 350px; text-align: center; }
        .login-box input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-family: 'Poppins', sans-serif; }
        .login-box button { width: 100%; padding: 12px; background: var(--accent-color); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .login-box button:hover { background: #d35400; }
        #login-error { color: #e74c3c; font-size: 0.9em; margin-top: 10px; display: none; }

        /* Dashboard Container */
        #dashboard-container { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .filtros { background: white; padding: 20px; border-radius: 15px; box-shadow: var(--shadow); margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; border: 1px solid #eae0d0;}
        .filtros input[type="date"] { padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-family: 'Poppins', sans-serif; }
        .filtros button { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 15px; box-shadow: var(--shadow); text-align: center; border-bottom: 4px solid var(--accent-color); }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 1em; opacity: 0.8; }
        .stat-card .valor { font-size: 2em; font-weight: 600; color: var(--accent-color); }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; box-shadow: var(--shadow); }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid #f1f1f1; }
        th { background: var(--header-bg); font-weight: 600; color: #8d6e63; }
        tr:hover { background-color: #fafafa; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Pastamania</h1>
        <h2>Panel de Administración y Estadísticas</h2>
        <button id="btn-logout">Cerrar Sesión</button>
    </div>

    <div id="login-container">
        <div class="login-box">
            <h2>Acceso Restringido</h2>
            <input type="email" id="email" placeholder="Correo electrónico" autocomplete="email">
            <input type="password" id="password" placeholder="Contraseña">
            <button id="btn-login">Entrar</button>
            <p id="login-error">Credenciales incorrectas.</p>
        </div>
    </div>

    <div id="dashboard-container">
        <div class="filtros">
            <label><strong>Desde:</strong></label>
            <input type="date" id="fecha-inicio">
            <label><strong>Hasta:</strong></label>
            <input type="date" id="fecha-fin">
            <button id="btn-filtrar">Aplicar Filtro</button>
            <button id="btn-hoy" style="background:#2ecc71;">Ver Hoy</button>
            <button id="btn-reset-sorpresa" style="background:#e74c3c; margin-left: auto;">Resetear Sorpresa</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Mesas Atendidas</h3>
                <div class="valor" id="stat-total-mesas">0</div>
            </div>
            <div class="stat-card" style="border-color: #3498db;">
                <h3>T. Medio Cocina</h3>
                <div class="valor" id="stat-t-cocina" style="color:#3498db;">00:00</div>
            </div>
            <div class="stat-card" style="border-color: #e74c3c;">
                <h3>T. Medio Fuegos</h3>
                <div class="valor" id="stat-t-fuegos" style="color:#e74c3c;">00:00</div>
            </div>
            <div class="stat-card" style="border-color: #9b59b6;">
                <h3>T. Medio Total</h3>
                <div class="valor" id="stat-t-total" style="color:#9b59b6;">00:00</div>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Mesa</th>
                    <th>Carnes</th>
                    <th>Marchada (Sala)</th>
                    <th>Tiempo Cocina</th>
                    <th>Tiempo Fuegos</th>
                </tr>
            </thead>
            <tbody id="tabla-body">
                </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js"; 
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, get, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCCS-znEaMQJmzRcraK2v0dfV3S_rCwA8w", 
            authDomain: "comandasrestaurante.firebaseapp.com", 
            databaseURL: "https://comandasrestaurante-default-rtdb.europe-west1.firebasedatabase.app", 
            projectId: "comandasrestaurante", 
            storageBucket: "comandasrestaurante.firebasestorage.app", 
            messagingSenderId: "242359011020", 
            appId: "1:242359011020:web:70d0e9fd5712b1d3662469" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // UI Elements
        const loginContainer = document.getElementById('login-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const btnLogout = document.getElementById('btn-logout');
        
        // Autenticación
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginContainer.style.display = 'none';
                dashboardContainer.style.display = 'block';
                btnLogout.style.display = 'block';
                configurarFechasPorDefecto();
                cargarEstadisticas();
            } else {
                loginContainer.style.display = 'flex';
                dashboardContainer.style.display = 'none';
                btnLogout.style.display = 'none';
            }
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, password).catch(error => {
                document.getElementById('login-error').style.display = 'block';
            });
        });

        btnLogout.addEventListener('click', () => signOut(auth));

        document.getElementById('btn-reset-sorpresa').addEventListener('click', () => {
            if(confirm('¿Lanzar la sorpresa de nuevo en las tablets?')) {
                remove(ref(db, 'sorpresa_estado'));
                alert('¡Sorpresa activada de nuevo!');
            }
        });

        // Lógica de Estadísticas
        function configurarFechasPorDefecto() {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('fecha-inicio').value = hoy;
            document.getElementById('fecha-fin').value = hoy;
        }

        document.getElementById('btn-filtrar').addEventListener('click', cargarEstadisticas);
        document.getElementById('btn-hoy').addEventListener('click', () => {
            configurarFechasPorDefecto();
            cargarEstadisticas();
        });

        function formatTimeDiff(ms) {
            if (!ms || ms < 0) return "-";
            const totalSegundos = Math.floor(ms / 1000);
            const minutos = Math.floor(totalSegundos / 60);
            const segundos = totalSegundos % 60;
            return `${minutos}m ${segundos}s`;
        }

        async function cargarEstadisticas() {
            const fechaInicio = document.getElementById('fecha-inicio').value;
            const fechaFin = document.getElementById('fecha-fin').value;
            
            const snapshot = await get(ref(db, 'estadisticas'));
            const datos = snapshot.val();
            
            const tbody = document.getElementById('tabla-body');
            tbody.innerHTML = '';

            if (!datos) {
                document.getElementById('stat-total-mesas').innerText = '0';
                return;
            }

            let totalMesas = 0; let sumaCocina = 0, countCocina = 0; let sumaFuegos = 0, countFuegos = 0; let sumaTotal = 0, countTotal = 0;

            const arrayDatos = Object.values(datos).reverse();

            arrayDatos.forEach(stat => {
                if (stat.fecha >= fechaInicio && stat.fecha <= fechaFin) {
                    totalMesas++;
                    let tiempoCocinaMs = 0; let tiempoFuegosMs = 0; let tiempoTotalMs = 0;

                    if (stat.timestamp_marchada && stat.timestamp_dentro) {
                        tiempoCocinaMs = stat.timestamp_dentro - stat.timestamp_marchada;
                        sumaCocina += tiempoCocinaMs; countCocina++;
                    }

                    if (stat.timestamp_dentro && stat.timestamp_salida) {
                        tiempoFuegosMs = stat.timestamp_salida - stat.timestamp_dentro;
                        sumaFuegos += tiempoFuegosMs; countFuegos++;
                    }

                    if (stat.timestamp_marchada && stat.timestamp_salida) {
                        tiempoTotalMs = stat.timestamp_salida - stat.timestamp_marchada;
                        sumaTotal += tiempoTotalMs; countTotal++;
                    } else if (stat.timestamp_marchada && stat.timestamp_dentro && !stat.carnes) {
                        tiempoTotalMs = stat.timestamp_dentro - stat.timestamp_marchada;
                        sumaTotal += tiempoTotalMs; countTotal++;
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${stat.fecha}</td>
                        <td><strong>Mesa ${stat.mesa}</strong></td>
                        <td>${stat.carnes ? '🥩 Sí' : '🍝 No'}</td>
                        <td>${new Date(stat.timestamp_marchada).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</td>
                        <td>${tiempoCocinaMs ? formatTimeDiff(tiempoCocinaMs) : 'En proceso...'}</td>
                        <td>${stat.carnes ? (tiempoFuegosMs ? formatTimeDiff(tiempoFuegosMs) : 'En proceso...') : '-'}</td>
                    `;
                    tbody.appendChild(tr);
                }
            });

            document.getElementById('stat-total-mesas').innerText = totalMesas;
            document.getElementById('stat-t-cocina').innerText = countCocina ? formatTimeDiff(sumaCocina / countCocina) : '0m 0s';
            document.getElementById('stat-t-fuegos').innerText = countFuegos ? formatTimeDiff(sumaFuegos / countFuegos) : '0m 0s';
            document.getElementById('stat-t-total').innerText = countTotal ? formatTimeDiff(sumaTotal / countTotal) : '0m 0s';
        }
    </script>
</body>
</html>
